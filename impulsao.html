<!doctype html>
<html lang="pt-BR" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Código da Areia | Treinos de Impulsão para o Vôlei</title>
    
    <!-- Favicon e Ícones -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="description" content="Aplicativo de impulsão para elevar o seu salto: exercícios com vídeo de cada movimento, treino pronto para ataque e bloqueio e o Desafio Impulsão 21 Dias." />
    <meta property="og:title" content="Código da Areia | Treinos de Impulsão para o Vôlei" />
    <meta property="og:description" content="Exercícios de impulsão com vídeo de cada movimento, treino pronto para ataque e bloqueio e Desafio Impulsão 21 Dias no app Código da Areia." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Pré-conexão com o servidor do pixel para máximo Connect Rate -->
    <link rel="dns-prefetch" href="https://lowtrack.com.br" />
    <link rel="preconnect" href="https://lowtrack.com.br" crossorigin />

    <!-- Pixel da Lowtrack (prioritário para Connect Rate / PageView) -->
    <script>
      window.pixelId = "lt_px_119ee6776d00";
      (function () {
        var a = document.createElement("script");
        a.async = true;
        a.src = "https://lowtrack.com.br/pixel.js";
        document.head.appendChild(a);
      })();
    </script>

    <!-- Microsoft Clarity carregado na 1ª interação do usuário (ou após 7s), mantendo gravação real sem pesar no carregamento inicial -->
    <script>
      (function () {
        var carregou = false;
        var iniciarClarity = function () {
          if (carregou) return;
          carregou = true;
          ["pointerdown", "scroll", "keydown", "touchstart"].forEach(function (ev) {
            window.removeEventListener(ev, iniciarClarity);
          });
          (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
          })(window, document, "clarity", "script", "zd8bfzlbbj");
        };
        ["pointerdown", "scroll", "keydown", "touchstart"].forEach(function (ev) {
          window.addEventListener(ev, iniciarClarity, { passive: true, once: true });
        });
        window.addEventListener("load", function () {
          setTimeout(iniciarClarity, 7000);
        });
      })();
    </script>

  </head>
  <body class="bg-[#F6F0E1] text-[#14110B] antialiased selection:bg-[#FFC60B] selection:text-[#14110B]">

  </body>
</html>
